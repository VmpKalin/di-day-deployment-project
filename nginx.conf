server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok";
    }

    # Vite emits content-hashed filenames — safe to cache forever
    location ~* \.(js|css|woff2?|svg|png|jpg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html must never be cached, or the browser shows the old SHA
    # after a deploy — on stage that looks like a broken pipeline
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
