name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# packages: write lets the built-in GITHUB_TOKEN push to GHCR, so no
# manually created secret is needed for the registry login below.
permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # GHCR rejects uppercase path segments, and GitHub usernames may
      # contain capitals — lowercase explicitly instead of hardcoding.
      - name: Compute image name
        id: image
        run: |
          echo "name=ghcr.io/${OWNER,,}/di-test-project" >> "$GITHUB_OUTPUT"
          echo "sha_short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "build_time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
        env:
          OWNER: ${{ github.repository_owner }}

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=sha-${{ steps.image.outputs.sha_short }}
            type=raw,value=latest

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VITE_APP_VERSION=0.1.0
            VITE_GIT_SHA=${{ steps.image.outputs.sha_short }}
            VITE_GIT_BRANCH=${{ github.ref_name }}
            VITE_BUILD_TIME=${{ steps.image.outputs.build_time }}

      - name: Print pushed image reference
        run: |
          echo "Pushed: ${{ steps.image.outputs.name }}:sha-${{ steps.image.outputs.sha_short }}"
          echo "Pushed: ${{ steps.image.outputs.name }}:latest"
