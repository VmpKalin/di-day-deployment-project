name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# packages: write lets the built-in GITHUB_TOKEN push to GHCR, so no
# manually created secret is needed for the registry login below.
permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    # The deploy job consumes this exact tag — never recomputes it.
    outputs:
      image_tag: sha-${{ steps.image.outputs.sha_short }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # GHCR rejects uppercase path segments, and GitHub usernames may
      # contain capitals — lowercase explicitly instead of hardcoding.
      - name: Compute image name
        id: image
        run: |
          echo "name=ghcr.io/${OWNER,,}/di-test-project" >> "$GITHUB_OUTPUT"
          echo "sha_short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "build_time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
        env:
          OWNER: ${{ github.repository_owner }}

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=sha-${{ steps.image.outputs.sha_short }}
            type=raw,value=latest

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VITE_APP_VERSION=0.1.0
            VITE_GIT_SHA=${{ steps.image.outputs.sha_short }}
            VITE_GIT_BRANCH=${{ github.ref_name }}
            VITE_BUILD_TIME=${{ steps.image.outputs.build_time }}

      - name: Print pushed image reference
        run: |
          echo "Pushed: ${{ steps.image.outputs.name }}:sha-${{ steps.image.outputs.sha_short }}"
          echo "Pushed: ${{ steps.image.outputs.name }}:latest"

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      # Pin the server's host key instead of disabling checking.
      - name: Add server to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}

      # Reset the server checkout to THIS workflow's commit before running
      # deploy.sh, so script + compose file match the image being deployed.
      # ssh streams remote output live and propagates deploy.sh's exit code.
      - name: Refresh server checkout and deploy
        run: |
          ssh "$DEPLOY_USER@$DEPLOY_HOST" \
            "cd /opt/di-day-deployment-project \
             && git fetch -q origin main && git reset --hard -q '$GIT_SHA' \
             && scripts/deploy.sh '$IMAGE_TAG'"
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          IMAGE_TAG: ${{ needs.build-and-push.outputs.image_tag }}
          GIT_SHA: ${{ github.sha }}
